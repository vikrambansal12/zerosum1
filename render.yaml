# Render Blueprint for the Zerosum backend (Express + Postgres + file uploads).
# Deploy via: Render Dashboard -> New -> Blueprint -> select this repo.
#
# Product/admin data lives in Postgres (add a Render Postgres instance
# separately and set DATABASE_URL below to its connection string -- Render
# auto-populates this if the Postgres instance is created via the same
# Blueprint, otherwise set it manually from the dashboard).
#
# This service still needs the persistent disk below for uploaded product
# images -- Render's free tier does NOT include one, so the free tier will
# silently lose uploaded images on every deploy. The paid "Starter" instance
# type (or higher) is required to attach a disk.
services:
  - type: web
    name: zerosum-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) after import --
      # they hold real secrets and are intentionally not in this file.
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      # Comma-separated list -- must include your deployed Vercel frontend
      # URL (and this Render service's own URL, for same-origin admin use)
      - key: ALLOWED_ORIGINS
        sync: false
      # Postgres connection string (see the note at the top of this file).
      - key: DATABASE_URL
        sync: false
      # Points new uploads at the persistent disk mounted below, instead of
      # the ephemeral code-deploy filesystem.
      - key: UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: zerosum-data
      mountPath: /var/data
      sizeGB: 1

# Fly.io app config. Deploy with: fly launch --no-deploy (first time, to
# create the app without using its own generated config), then fly deploy.
# Before the first deploy:
#   1. fly volumes create zerosum_data --size 1 --region <same as this app>
#   2. fly postgres create (or attach an existing Fly Postgres app), then
#      fly secrets set DATABASE_URL=... with its connection string --
#      product/admin data lives in Postgres now, not the volume above (which
#      is still needed for uploaded product images, see UPLOADS_DIR below).
#   3. fly secrets set SENDGRID_API_KEY=... FROM_EMAIL=... \
#        NOTIFICATION_EMAIL=... ALLOWED_ORIGINS=...
#      (same values as backend/.env -- never commit those values into this file)

app = "zerosum-backend"
primary_region = "bom"  # Mumbai -- change to whichever region you actually pick

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  # Persistent volume mount point (see [[mounts]] below) -- keeps uploaded
  # product images across deploys/restarts. Product/admin data lives in
  # Postgres (DATABASE_URL secret, see above), not this volume.
  UPLOADS_DIR = "/data/uploads"

[[mounts]]
  source = "zerosum_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

# Railway deploy config for the Zerosum backend. Builds from the same
# repo-root Dockerfile used for the Fly.io deploy (see fly.toml) -- Railway
# needs no separate Dockerfile since server.js already reads all of its
# config from env vars.
#
# Before the first deploy:
#   1. Railway dashboard -> New Project -> Deploy from GitHub repo -> select
#      this repo. Railway reads this file and builds the root Dockerfile.
#   2. Add a Volume (Service -> Settings -> Volumes), mount path /data --
#      keeps the SQLite DB and uploaded images across redeploys. Without
#      this, both are wiped on every deploy.
#   3. Set variables (Service -> Variables tab, or `railway variables --set
#      KEY=value` from the CLI). Railway config-as-code doesn't hold
#      variables, so none of these live in this file, even the non-secret
#      ones:
#        NODE_ENV=production
#        SQLITE_DATA_DIR=/data/sqlite
#        UPLOADS_DIR=/data/uploads
#        SMTP_HOST=... SMTP_PORT=... SMTP_SECURE=... SMTP_USER=... SMTP_PASS=...
#        NOTIFICATION_EMAIL=...
#        ALLOWED_ORIGINS=...          (comma-separated, include your deployed
#                                      frontend origin and this service's own
#                                      Railway URL)
#      Railway injects PORT itself -- server.js already reads process.env.PORT,
#      so don't set PORT manually.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
